{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} - Admin{% endblock %}

{% block content %}
<section class="admin-section">
    <div class="container">
        <div class="admin-header">
            <h1>{{ title }}</h1>
            <a href="{% url 'products:admin_products' %}" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Products
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="admin-form">
            {% csrf_token %}
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" name="name" value="{{ product.name|default:'' }}" required>
                </div>

                <div class="form-group">
                    <label>Category *</label>
                    <select name="category" required>
                        <option value="">Select Category</option>
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if product.category.id == category.id %}selected{% endif %}>
                            {{ category.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Price *</label>
                    <input type="number" step="0.01" name="price" value="{{ product.price|default:'' }}" required>
                </div>

                <div class="form-group">
                    <label>Compare Price (Original)</label>
                    <input type="number" step="0.01" name="compare_price" value="{{ product.compare_price|default:'' }}">
                </div>

                <div class="form-group">
                    <label>Stock Quantity *</label>
                    <input type="number" name="stock" value="{{ product.stock|default:'0' }}" required>
                </div>

                <div class="form-group">
                    <label>Main Image</label>
                    <input type="file" name="main_image" accept="image/*">
                    {% if product.main_image %}
                    <div class="current-image">
                        <img src="{{ product.main_image.url }}" width="100">
                    </div>
                    {% endif %}
                </div>

                <div class="form-group full-width">
                    <label>Short Description</label>
                    <textarea name="short_description" rows="2">{{ product.short_description|default:'' }}</textarea>
                </div>

                <div class="form-group full-width">
                    <label>Full Description</label>
                    <textarea name="description" rows="5" required>{{ product.description|default:'' }}</textarea>
                </div>

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" name="is_featured" {% if product.is_featured %}checked{% endif %}>
                        Featured Product
                    </label>
                    <label>
                        <input type="checkbox" name="is_new" {% if product.is_new %}checked{% endif %}>
                        New Arrival
                    </label>
                    <label>
                        <input type="checkbox" name="is_bestseller" {% if product.is_bestseller %}checked{% endif %}>
                        Best Seller
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="save-btn">
                    <i class="fas fa-save"></i> Save Product
                </button>
                <a href="{% url 'products:admin_products' %}" class="cancel-btn">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
